name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle -p v4/rakah-counter-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rakah-counter-debug-apk
          path: v4/rakah-counter-android/app/build/outputs/apk/debug/app-debug.apk
