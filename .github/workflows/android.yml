name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle -p v5/rakah-counter-android assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rakah-counter-debug-apk
          path: v5/rakah-counter-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release Latest APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest tag and release if they exist
          gh release delete latest --yes || true
          
          # Rename the APK to a cleaner name for release
          cp v5/rakah-counter-android/app/build/outputs/apk/debug/app-debug.apk rakah-counter.apk
          
          # Create new latest release with the renamed APK
          gh release create latest rakah-counter.apk --title "Latest Build" --notes "Automated build of the latest version" --prerelease
